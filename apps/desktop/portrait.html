<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>规智</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/portrait.css">
<script defer src="/markdown-it.js"></script>
<script defer src="/markdown.js"></script>
<script type="module" src="/portrait.js"></script>
</head>
<body><main>
<button id="figure-toggle" type="button" aria-label="打开文字对话" data-hit>
<svg id="figure" viewBox="0 0 128 128" aria-hidden="true">
    <defs>
        <linearGradient id="jade" x1="0" x2=".83" y1="0" y2="1">
            <stop stop-color="#E1F3FF"/><stop offset=".48" stop-color="#A9D5F5"/><stop offset="1" stop-color="#719FD1"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#F1F8FF"/><stop offset="1" stop-color="#456EAB"/>
        </linearGradient>
        <path id="parcel" d="M20 42c0-7 4-12 10-15L51 16c4-2 8-3 13-3l27 2c6 0 11 4 13 10l8 28c1 5 1 9-1 13L99 92c-2 5-7 8-12 9l-32 4c-5 1-10 0-14-3L23 90c-5-3-7-8-7-13z"/>
    </defs>
    <use href="#parcel" y="5" fill="#3F6399"/>
    <use href="#parcel" fill="url(#jade)" stroke="url(#rim)" stroke-width="1.5"/>
    <path class="contours" d="M27 48c8 0 13-3 18-9 6-8 14-12 25-13l19 1M28 39c6 0 10-3 15-8 6-6 14-9 22-9"/>
    <g class="eyes">
        <rect x="47" y="59" width="5.8" height="9" rx="2.9"/>
        <rect x="75" y="58" width="5.8" height="9" rx="2.9"/>
    </g>
    <path class="smile" d="M60 72q4 4 8 0"/>
    <ellipse id="speaking-mouth" cx="64" cy="73" rx="4.2" ry="2.5"/>
</svg>
</button>
<div id="bubble" hidden role="status" data-hit>
    <div id="message" hidden></div>
    <div id="status" hidden></div>
</div>
<div class="actions" data-hit aria-label="规智操作">
    <button type="button" id="type" aria-label="文字对话" title="文字对话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-7M10 14l1-4 7-7 3 3-7 7z"/></svg>
    </button>
    <button type="button" id="mic" aria-pressed="false" aria-label="语音对话" title="语音对话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4m4-7v10m3-13v16m3-13v10m4-7v4"/></svg>
    </button>
    <button type="button" id="open" aria-label="打开工作台" title="打开工作台">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></svg>
    </button>
</div>
</main></body>
</html>
