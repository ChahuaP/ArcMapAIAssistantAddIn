<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="/visual.css">
<script defer src="/visual.js"></script>
<title>规智办理状态</title>
</head>
<body>
<div id="edge" aria-hidden="true"><div class="edge-dots"><div class="edge-current"></div></div></div>
<div id="outline" aria-hidden="true"></div>
<div id="status">
    <svg id="icon" viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path></path></svg>
    <span id="label" role="status" aria-live="polite">规智正在分析任务</span>
    <button id="takeover" type="button">接管</button>
</div>
</body>
</html>
