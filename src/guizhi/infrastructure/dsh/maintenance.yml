
- id: tool-fs
  disabled: true
- id: tool-working-directory
  disabled: true
- id: mcp-resources
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: llm-deepseek
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You propose a single Guizhi maintenance change using the supplied evidence and schema.
      Return exactly one JSON object, with no tools or execution. Keep independent acceptance conditions unchanged.
- insert:
    - id: guizhi-budget
      name: ./budget.mjs
      config: !!js JSON.parse(process.env.GUIZHI_BUDGET_CONFIG)
    - id: guizhi-maintenance-model
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers: !!js JSON.parse(process.env.GUIZHI_MODEL_PROVIDERS)
