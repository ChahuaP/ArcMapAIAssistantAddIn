# Applied to the pinned SDK-minimal bundle.
- id: tool-fs
  disabled: true
- id: tool-working-directory
  disabled: true
- id: mcp-resources
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: llm-deepseek
  disabled: true
- id: compaction-basic
  config:
    auto: true
    headroomTokens: 1024
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      你叫小六，协助办理规划和自然资源业务。以第一人称用中文回答。普通交流直接回应。直接回答本轮所问，按需给出依据和单位。只陈述回执支持的操作与结果。
      以本轮请求为准，结合对话历史与当前地图区分用户指的对象、范围、要执行的动作和预期成果。若现有信息足够就直接办理。对象或必要参数尚未确定，而且会改变结果时，用 request_clarification 询问用户。
      材料和地图使用系统给出的引用。整层和选区是不同的数据范围。字段、取值、坐标、视觉和业务规则均以对应工具返回的实际证据为准。抽样用于理解结构，统计结论须在要求的范围内计算。
      遇到业务术语、政策条款或办理依据，按需用 search_knowledge 查资料，并用 read_knowledge_source 核对引用。说明文件名、页码或章节和适用条件。
      按需查看技能、操作目录和参数契约。只读探查可用于计划和纠错。使用 execute_workflow 时按依赖顺序传结构化步骤；material.角色引用材料，step.步骤引用前序图层，$selection.步骤、$run.步骤、$value.步骤引用相应结果。
      可独立验证的工作优先交给子智能体，例如分别读取审批材料、检查图层和查证公开依据。用同一批工具调用并行分派互不依赖的子任务，需要交接和先后依赖时使用团队任务板。
      给每个子任务明确材料引用、范围、完成标准和需要返回的证据。子智能体只读核查，取得足够证据后立即返回。主智能体核对范围、来源和结果，仅在证据不足或冲突时补查。等待设定时间上限，发现停滞或偏离时中断或重新分派。
      网页工具仅用于查阅公开资料，查询和网址只使用检索所必需的公开信息，回答附实际来源链接。
      已选业务的材料与参数以绑定摘要为准，齐全时直接执行。自由任务每次工具运行后核对其输入、实际效果和产物。空结果、部分结果或失败时核实条件并决定下一步。完成后用 deliver_result 提交本轮已核验的结果，选择符合用户意图的产物。只问事实时保持地图状态。
- insert:
    - id: subagent
      name: '@deepseek-ai/dsh-subagent'
      config:
        maxDepth: 1
        maxActiveSubagents: 2
    - id: agent-team
      name: '@deepseek-ai/dsh-agent-team'
      config:
        defaultEnabled: true
        maxTasks: 32
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-tool-agent-team'
    - id: subagent-spawn-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: web
      name: '@deepseek-ai/dsh-web'
    - id: web-deepseek-api
      name: '@deepseek-ai/dsh-web-deepseek-api'
      config: !!js JSON.parse(process.env.GUIZHI_WEB_PROVIDER)
    - id: tool-call-timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config: !!js JSON.parse(process.env.GUIZHI_WEB_TOOLS)
    - id: guizhi-dispatch-policy
      name: ./dispatch-policy.mjs
      config: !!js JSON.parse(process.env.GUIZHI_DISPATCH_CONFIG)
    - id: guizhi-model
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers: !!js JSON.parse(process.env.GUIZHI_MODEL_PROVIDERS)
    - id: guizhi-business
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: guizhi
        transport: stdio
        command: !!js process.env.GUIZHI_PYTHON
        args: !!js JSON.parse(process.env.GUIZHI_MCP_ARGS)
        toolCallTimeoutMs: 600000
        failOnStartupError: true
