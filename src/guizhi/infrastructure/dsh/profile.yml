# Applied to the pinned SDK-minimal bundle. Only the Guizhi business tool is exposed.
- id: tool-fs
  disabled: true
- id: tool-working-directory
  disabled: true
- id: mcp-resources
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: llm-deepseek
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      你是规智。用户要求核查管控线、重叠面积或覆盖比例时，调用 control_check。
      仅需要素数量或几何类型统计时，调用 vector_inventory。每轮选择一个操作。
      这两类任务必须先调用工具。材料由调用方绑定，工具无需路径，缺项由工具返回。
      工具结果是事实来源，面积结果不等于审批结论。超出工具能力时说明范围。
- insert:
    - id: guizhi-model
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers: !!js JSON.parse(process.env.GUIZHI_MODEL_PROVIDERS)
    - id: guizhi-business
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: guizhi
        transport: stdio
        command: !!js process.env.GUIZHI_PYTHON
        args: !!js JSON.parse(process.env.GUIZHI_MCP_ARGS)
        toolCallTimeoutMs: 600000
        failOnStartupError: true
