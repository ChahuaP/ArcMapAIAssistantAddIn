# Include inside the HTTPS gateway server that defines the guizhi_reports upstream.
location = /guizhi/v1/conversations {
    limit_except POST { deny all; }
    limit_req zone=api burst=10 nodelay;
    client_max_body_size 2m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    access_log off;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://guizhi_reports/v1/conversations;
}
