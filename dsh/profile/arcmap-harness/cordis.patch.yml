# ArcMap GIS composition; installed paths are substituted by install_profile.ps1.
- insert:
    - id: mcp-arcmap
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: arcmap
        transport: stdio
        command: 'python'
        args: ['server/main.py']
        toolCallTimeoutMs: 660000
        failOnStartupError: true
    - id: arcmap-agent
      name: 'arcmap-agent'
    - id: arcmap-brand
      name: 'arcmap-brand'
    - id: arcmap-status
      name: 'arcmap-status'

# Replace the official DeepSeek brand occupants with ArcMap Harness.
- id: ui-brand-official
  disabled: true

# The agent must not execute code outside the ArcMap door: code-runtime is
# the PTC/PowerShell execution channel the standard preset otherwise offers.
- id: code-runtime
  disabled: true

# MiniMax via its official first-class protocol (Anthropic-compatible) through
# the pi-ai provider catalog; the OpenAI-compat /v1 endpoint lacks the [DONE]
# SSE sentinel, which the strict dsh-llm-deepseek client rejects.
# Additional providers are optional and surfaced in the console model picker;
# the default model stays MiniMax-M3.
- id: llm-pi-ai
  config:
    providers:
      minimax-cn:
        apiKeyEnv: MINIMAX_API_KEY
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
      qwen:
        displayName: 通义千问
        api: openai-completions
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        apiKeyEnv: QWEN_API_KEY
        defaultContextWindow: 131072
        defaultMaxTokens: 8192
        models:
          - id: qwen-max
            name: qwen-max
          - id: qwen-plus
            name: qwen-plus
          - id: qwen2.5-7b-instruct
            name: qwen2.5-7b-instruct
      zhipu:
        displayName: 智谱 GLM
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/paas/v4
        apiKeyEnv: ZHIPU_API_KEY
        defaultContextWindow: 131072
        defaultMaxTokens: 8192
        models:
          - id: glm-4-plus
            name: glm-4-plus
          - id: glm-4-flash
            name: glm-4-flash
      ollama:
        displayName: 本地 Ollama
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: OLLAMA_API_KEY
        defaultContextWindow: 32768
        defaultMaxTokens: 2048
        models:
          - id: qwen2.5:7b-arcmap
            name: Qwen2.5 7B

# Only this deployment preset is selectable.
- id: agent-presets
  config:
    default: arcmap
    includeShippedRoot: false

- id: agent-default-model
  config:
    provider: minimax-cn
    model: MiniMax-M3

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: ''

